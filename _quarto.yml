# =====================================================================
#  Quarto book config — Farsi (RTL) technical book.
#
#  Validated Persian/RTL toolchain:
#    * PDF : LuaLaTeX + babel (bidi=basic), fonts/Vazirmatn via theme/preamble.tex
#    * HTML: cosmo + theme/custom.scss, dir=rtl/lang=fa, LTR islands via ltr.lua
#  NOTE: do NOT set a global `lang:` — it makes Pandoc load babel/polyglossia
#  for PDF and clashes with our preamble. `lang`/`dir` are set on html only.
# =====================================================================
project:
  type: book
  output-dir: _book

book:
  title: "ساخت دستگاه پیشرفتهٔ MRI: از دبیرستان تا مهندسی"
  subtitle: "یک رسالهٔ جامع مهندسی — فیزیک، الکترونیک، نرم‌افزار، پزشکی، ساخت، ایمنی و نگه‌داری"
  author: "رحمت سعیدی"
  # cover-image: cover/cover.png    # add cover art under cover/, then re-enable
  search: true
  chapters:
    - index.qmd
    - chapters/01-sample-chapter.qmd

bibliography: references.bib

filters:
  - theme/ltr.lua

format:
  html:
    lang: fa
    dir: rtl
    theme:
      - cosmo
      - theme/custom.scss
    include-in-header: theme/mathjax-config.html
    toc: true
    toc-title: "فهرست"
    number-sections: true
    code-copy: true
    code-overflow: wrap
  pdf:
    pdf-engine: lualatex
    # All LaTeX packages are pre-installed (locally per README; on CI by the
    # workflow), so Quarto's auto-install is pure liability: babel's Persian locale
    # requests a hyphenation file, and Quarto maps it to the obsolete package name
    # `hyphen-persian`, which does not exist in current TeX Live -> tlmgr errors and
    # the whole render fails even though the PDF compiled fine (Persian does not
    # hyphenate, so the missing file is irrelevant). Turn auto-install off.
    latex-auto-install: false
    documentclass: scrreport
    include-in-header: theme/preamble.tex
    toc: true
    toc-depth: 2          # Quarto book maps toc-depth:N -> LaTeX tocdepth N-1;
                          # 2 => tocdepth 1 => ToC lists chapters + sections only
                          # (subsections hidden) to keep the PDF ToC compact.
    number-sections: true
    colorlinks: true
    code-overflow: wrap
