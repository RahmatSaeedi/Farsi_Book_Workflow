name: build-and-deploy

# Renders the book (HTML + PDF) and deploys the website to GitHub Pages.
# The validated toolchain: Quarto + TinyTeX (LuaLaTeX + babel bidi=basic).
# Vazirmatn fonts are committed under fonts/ and loaded by file, so no system
# font install is needed. Diagrams are built from TikZ to PDF + SVG by
# tools/build_diagrams.py (LuaLaTeX + PyMuPDF), invoked via `make -C diagrams`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # quarto-actions/setup installs TinyTeX to ~/.TinyTeX, but its Linux
      # branch only puts ~/bin on PATH — and tlmgr may symlink the binaries into
      # ~/.local/bin or /usr/local/bin instead, leaving ~/bin empty. So `quarto
      # render` works (Quarto finds ~/.TinyTeX itself) while a plain `run:` step
      # calling lualatex/tlmgr fails with "command not found". Point PATH at the
      # real TinyTeX bin dir for the rest of the job (run: steps use a no-rc
      # shell, so this must go through $GITHUB_PATH).
      - name: Put TinyTeX (lualatex/tlmgr) on PATH
        run: |
          find_bin() { dirname "$(find "$1" -path '*/bin/*/lualatex' 2>/dev/null | head -n1)"; }
          BIN=$(find_bin "$HOME/.TinyTeX")
          [ -x "$BIN/lualatex" ] || BIN=$(find_bin "$HOME")
          if [ ! -x "$BIN/lualatex" ]; then
            echo "::error::lualatex not found after quarto install tinytex"; exit 1
          fi
          echo "TinyTeX bin: $BIN"
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps (PyMuPDF crops figures to SVG/PDF)
        run: pip install -r requirements.txt

      - name: Install LaTeX packages for diagrams and PDF
        run: |
          # `babel` ships all locale data, incl. Persian (locale/fa/babel-fa.ini,
          # loaded by \babelprovide{persian}) -- there is NO `babel-persian` TeX
          # Live package. babel's LuaTeX backend \RequirePackages luatexbase +
          # ctablestack, and the graphics driver pulls epstopdf-pkg; tlmgr does
          # not always drag these in as deps, so list them explicitly. Packages
          # already in TinyTeX's base just report "already present".
          tlmgr install babel luatexbase ctablestack \
            geometry pgf pgfplots xcolor fancyvrb framed koma-script \
            unicode-math epstopdf-pkg

      - name: Build vector diagrams (LuaLaTeX -> PyMuPDF -> PDF + SVG)
        run: make -C diagrams

      - name: Render book (HTML + PDF)
        # On failure Quarto leaves the LaTeX log but doesn't print it, so a PDF
        # error shows only "compilation failed". Dump index.log so CI says why.
        run: |
          quarto render || {
            echo "::group::index.log -- LaTeX error lines"
            grep -nE '^(\! |l\.[0-9])' index.log 2>/dev/null | tail -n 80 || true
            echo "::endgroup::"
            echo "::group::index.log -- last 120 lines"
            tail -n 120 index.log 2>/dev/null || echo "(index.log not present)"
            echo "::endgroup::"
            exit 1
          }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
